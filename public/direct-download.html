<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل مباشر - منصة حارس الأمن</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
            text-align: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .download-btn {
            display: inline-block;
            background: #28a745;
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 18px;
            margin: 20px 0;
            font-weight: bold;
        }
        .download-btn:hover {
            background: #218838;
        }
        .file-info {
            background: #e9ecef;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
        }
    </style>
    <script>
        function downloadFile() {
            const link = document.createElement('a');
            link.href = './haris-security-platform-guard.tar.gz';
            link.download = 'haris-security-platform-guard.tar.gz';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            setTimeout(() => {
                document.getElementById('status').innerHTML = '✅ تم بدء التحميل';
            }, 500);
        }
    </script>
</head>
<body>
    <div class="container">
        <h1>🔐 منصة حارس الأمن</h1>
        <h2>تحميل الملف النهائي</h2>
        
        <div class="file-info">
            <strong>اسم الملف:</strong> haris-security-platform-guard.tar.gz<br>
            <strong>الحجم:</strong> 5.1 ميجابايت<br>
            <strong>المحتويات:</strong> 72 ملف<br>
            <strong>المخصص لـ:</strong> nalhumaid.com/guard/
        </div>
        
        <button class="download-btn" onclick="downloadFile()">
            📥 تحميل الملف
        </button>
        
        <div id="status" style="margin-top: 20px; font-weight: bold;"></div>
        
        <p>أو استخدم الرابط المباشر:</p>
        <a href="./haris-security-platform-guard.tar.gz" download>
            haris-security-platform-guard.tar.gz
        </a>
    </div>
</body>
</html>
